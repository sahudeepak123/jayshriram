<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Available Forms - JSRC Pawai</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
:root{
 --blue:#0a4c9a;
 --bg:#f4f7f6;
 --border:#e0e0e0;
}

body{
 margin:0;
 font-family:Inter,Arial;
 background:var(--bg);
}

/* HEADER */
header{
 background:var(--blue);
 color:#fff;
 padding:12px 16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:10px;
}

.header-left{
 display:flex;
 align-items:center;
 gap:10px;
}

header img{
 width:45px;
 height:45px;
 border-radius:50%;
 border:2px solid #fff;
 cursor:pointer;
}

.header-titles h1{
 margin:0;
 font-size:1.2rem;
}
.header-titles h6{
 margin:0;
 font-size:.85rem;
 opacity:.85;
}

.header-right{
 display:flex;
 gap:12px;
}

.home-header-button{
 background:rgba(255,255,255,.15);
 padding:7px 12px;
 border-radius:6px;
 text-decoration:none;
 color:#fff;
}

.whatsapp-icon{
 font-size:1.6rem;
 color:#fff;
}

/* MAIN */
main{
 max-width:600px;
 margin:30px auto;
 padding:0 15px;
}

h2{
 text-align:center;
 color:var(--blue);
}

/* SEARCH */
.search-box{
 margin:20px 0;
}
.search-box input{
 width:100%;
 padding:12px 18px;
 border-radius:25px;
 border:1px solid #ccc;
 font-size:1rem;
}

/* FORM LIST */
.form-list{
 display:flex;
 flex-direction:column;
 gap:12px;
}

.form-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#fff;
 padding:14px 20px;
 border-radius:8px;
 border:1px solid var(--border);
}

.form-name{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:500;
}

.download-btn{
 background:var(--blue);
 color:#fff;
 padding:7px 14px;
 border-radius:6px;
 text-decoration:none;
 font-size:.9rem;
}

/* FOOTER */
footer{
 text-align:center;
 padding:25px 10px;
 border-top:1px solid var(--border);
 font-size:.9rem;
}

/* IMAGE MODAL */
.img-modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.85);
 justify-content:center;
 align-items:center;
 z-index:9999;
}
.img-modal img{
 max-width:90%;
 max-height:90%;
 border-radius:10px;
}
.close-btn{
 position:absolute;
 top:20px;
 right:25px;
 font-size:32px;
 color:#fff;
 cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="/Screenshot 2025-10-25 at 19.44.03.png" id="profileImg">
    <div class="header-titles">
      <h1>JAY SHRI RAM COMPUTER</h1>
      <h6>deepak mponline pawai</h6>
    </div>
  </div>

  <div class="header-right">
    <a href="/index.html" class="home-header-button">🏠 Home</a>
    <a href="https://wa.me/918839142440" class="whatsapp-icon" target="_blank">
      <i class="bi bi-whatsapp"></i>
    </a>
  </div>
</header>

<main>
<h2>Available Forms</h2>

<!-- SEARCH BOX -->
<div class="search-box">
<input id="searchInput" placeholder="Search form / फॉर्म खोजें (आय, aay, jati...)">
</div>

<!-- FORM LIST -->
<div class="form-list" id="formList"></div>
</main>

<footer>
<p>📞 8839142440 | 📍 Tahsheel Parishad Pawai</p>
<p>© <span id="year"></span> JSRC</p>
</footer>

<!-- IMAGE MODAL -->
<div id="imgModal" class="img-modal">
  <span class="close-btn">&times;</span>
  <img id="modalImg">
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

/* ===== FORMS DATA ===== */
const forms=[
 {name:"आय प्रमाण पत्र",file:"aay.pdf",keys:["आय","aay","income"]},
 {name:"जाति प्रमाण पत्र",file:"obc jati.pdf",keys:["जाति","jati","jaati","caste"]},
 {name:"निवास प्रमाण पत्र",file:"nivas.pdf",keys:["निवास","niwas","domicile"]},
 {name:"जन्म प्रमाण पत्र",file:"janm praman patra form.pdf",keys:["जन्म","janam","birth"]},
 {name:"विवाह पंजीयन",file:"vivahpanjiyan.pdf",keys:["विवाह","shadi","marriage"]},
 {name:"वृद्धा पेंशन",file:"bradha penstion.pdf",keys:["pension","वृद्धा"]},
 {name:"सीमांकन",file:"seemankan form.pdf",keys:["सीमांकन","seemankan"]},
 {name:"नामांतरण",file:"namantran form.pdf",keys:["नामांतरण","mutation"]}
];

const list=document.getElementById("formList");
const input=document.getElementById("searchInput");

function render(data){
 list.innerHTML="";
 if(!data.length){
  list.innerHTML="<div class='form-item'>कोई फॉर्म नहीं मिला</div>";
  return;
 }
 data.forEach(f=>{
  list.innerHTML+=`
  <div class="form-item">
    <div class="form-name"><i class="bi bi-file-earmark-pdf-fill"></i>${f.name}</div>
    <a href="${f.file}" class="download-btn" download>Download</a>
  </div>`;
 });
}

input.addEventListener("input",()=>{
 const t=input.value.toLowerCase();
 render(forms.filter(f=>
  f.name.includes(t) || f.keys.some(k=>k.includes(t))
 ));
});

render(forms);

/* IMAGE MODAL */
const profileImg=document.getElementById("profileImg");
const modal=document.getElementById("imgModal");
const modalImg=document.getElementById("modalImg");
const closeBtn=document.querySelector(".close-btn");

profileImg.onclick=()=>{
 modal.style.display="flex";
 modalImg.src=profileImg.src;
};
closeBtn.onclick=()=>modal.style.display="none";
modal.onclick=e=>{
 if(e.target===modal) modal.style.display="none";
};

document.getElementById("year").textContent=new Date().getFullYear();
});
</script>

</body>
</html>
